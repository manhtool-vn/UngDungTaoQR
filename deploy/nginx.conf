# /etc/nginx/sites-available/maqr.conf → ln -s ../sites-available/maqr.conf /etc/nginx/sites-enabled/
# Đổi qr.manhtool.id.vn (PUBLIC_URL) và mtqr.vn (SHORT_URL) thành tên miền thật, rồi cấp SSL:
#   sudo certbot --nginx -d qr.manhtool.id.vn -d mtqr.vn
# Trong .env đặt TRUST_PROXY=true để máy chủ đọc IP thật từ X-Forwarded-For.

server {
    listen 80;
    server_name qr.manhtool.id.vn mtqr.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qr.manhtool.id.vn mtqr.vn;

    ssl_certificate     /etc/letsencrypt/live/qr.manhtool.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.manhtool.id.vn/privkey.pem;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml;

    # Chạy sau Cloudflare: bỏ chú thích 2 dòng dưới và thêm đủ dải IP của Cloudflare (cloudflare.com/ips)
    # để $remote_addr là IP thật của người dùng thay vì IP của Cloudflare.
    # set_real_ip_from 173.245.48.0/20;
    # real_ip_header CF-Connecting-IP;

    # Mã QR động: không ghi log truy cập (chính sách bảo mật cam kết không lưu IP người quét)
    location /q/ {
        access_log off;
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ghi đè (không nối thêm) để người dùng không giả được IP qua header tự gửi
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
